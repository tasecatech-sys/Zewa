<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ZEWÁ · Presupuestos y Facturación</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/app.css">
  <script>
    try { const t = localStorage.getItem('tsf_theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <div id="loginScreen" class="login-screen"></div>
  <div class="app" id="appShell" hidden>
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">T</div>
        <div><b>ZEWÁ</b><small>Presupuestos y Facturación</small></div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot">Datos guardados en este navegador · v1.0</div>
    </aside>

    <div class="main">
      <header class="topbar">
        <button class="btn icon ghost menu-btn" id="menuBtn" aria-label="Abrir menú"><svg class="i"><use href="#i-menu"/></svg></button>
        <div class="gsearch">
          <svg class="i"><use href="#i-search"/></svg>
          <input id="gsearch" type="search" placeholder="Buscar NIF, cliente, nº de documento, proyecto, correo…" autocomplete="off" aria-label="Búsqueda global">
          <kbd>Ctrl K</kbd>
          <div class="gresults" id="gresults"></div>
        </div>
        <div class="top-actions">
          <button class="btn icon ghost" id="themeBtn" title="Modo claro / oscuro" aria-label="Cambiar tema"><svg class="i"><use href="#i-moon"/></svg></button>
          <div class="user-chip">
            <div class="avatar" id="avatar">AD</div>
            <select id="userSel" aria-label="Usuario actual"></select>
          </div>
          <button class="btn icon ghost" id="logoutBtn" title="Cerrar sesión" aria-label="Cerrar sesión"><svg class="i"><use href="#i-back"/></svg></button>
        </div>
      </header>
      <main class="content" id="view"></main>
    </div>
  </div>

  <div class="toasts" id="toasts"></div>
  <div id="print-area"></div>
